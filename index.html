<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3fa9f5" />
    <meta
      name="description"
      content="Jogo educativo gratuito em 3D para crianças autistas: mundo aberto, personalização e missões do dia a dia."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Lilo World</title>
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 24px;
        background: linear-gradient(#8fd3ff, #3fa9f5);
        transition: opacity 0.3s ease;
      }
      .splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      .splash__lilo {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: #ff9d3f;
        box-shadow: inset 0 -30px 0 #ffe9c9;
      }
      .splash__bar {
        width: min(280px, 70vw);
        height: 16px;
        overflow: hidden;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.5);
      }
      .splash__fill {
        display: block;
        width: 4%;
        height: 100%;
        border-radius: 8px;
        background: #fff;
        transition: width 0.2s ease;
      }
      .splash.is-waiting .splash__fill {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" class="splash" role="status" aria-label="Carregando">
      <div class="splash__lilo"></div>
      <div class="splash__bar"><span class="splash__fill"></span></div>
    </div>
    <noscript>Lilo World precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main/main.ts"></script>
  </body>
</html>
