version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week: most hijacked packages are found in days.
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Big jumps need their own review; security fixes still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
